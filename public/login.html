<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#1e4a3d"><title>로그인 · ReplyTrack</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/login.css"><script type="module" src="/login.js"></script></head>
<body class="auth-page"><main class="auth-main">
  <a href="/" class="brand"><img src="/favicon.svg" width="35" height="35" alt=""><span>ReplyTrack<span class="brand-dot">.</span></span></a>
  <h1 id="auth-title">내 문의를 이어서 정리하세요.</h1><p id="auth-description">가입 없이 시작하거나, 로그인해서 저장한 문의를 이어가세요.</p>
  <button class="btn primary wide" type="button" id="guest-start" aria-describedby="guest-help">가입 없이 시작하기</button>
  <p class="guest-help" id="guest-help">비회원 기록은 이 브라우저에서 7일간 이어 볼 수 있어요. 쿠키를 지우면 다시 찾을 수 없어요.</p>
  <p class="auth-error" id="auth-error" role="alert"></p>
  <form id="auth-form">
    <label class="field">아이디<input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" pattern="[a-z0-9][a-z0-9_-]{2,23}" minlength="3" maxlength="24" required><small>영문 소문자·숫자·밑줄·하이픈 3~24자</small></label>
    <label class="field">비밀번호<input name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required><small>12자 이상 입력해 주세요.</small></label>
    <label class="field" id="confirm-field" hidden>비밀번호 확인<input name="confirm" type="password" autocomplete="new-password" maxlength="128"></label>
    <button class="btn secondary wide" type="submit" id="auth-submit">로그인</button>
  </form>
  <button class="btn text" type="button" id="auth-switch">처음이신가요? 회원가입</button>
  <p class="auth-help">각자의 계정에 저장한 문의만 볼 수 있어요.<br>가입에 이메일 주소나 전화번호는 필요하지 않아요.</p>
</main></body></html>
