<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReplyTrack 상담 확인표</title>
  <link rel="stylesheet" href="sidepanel.css">
  <script type="module" src="sidepanel.js"></script>
</head>
<body>
  <a class="skip" href="#content">본문으로 이동</a>
  <header class="app-header">
    <a class="brand" href="http://127.0.0.1:3100" target="_blank" rel="noopener noreferrer" aria-label="ReplyTrack 웹 열기">
      <svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#193d37"/><path d="M11 11h17v13H18l-7 6V11Z" fill="none" stroke="#daedaa" stroke-width="2.5" stroke-linejoin="round"/><path d="m17 17 3 3 5-5" fill="none" stroke="#daedaa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      ReplyTrack
    </a>
    <a class="small-link" href="http://127.0.0.1:3100" target="_blank" rel="noopener noreferrer">웹 열기</a>
  </header>
  <div id="connection" class="connection" role="status"></div>
  <div id="feedback" role="alert" hidden></div>
  <div id="progress" class="progress" role="status" aria-live="polite" hidden></div>
  <div id="capture-notice" hidden></div>
  <main id="content" tabindex="-1"><p>상담 확인표를 준비하고 있어요.</p></main>
  <footer>답변을 받는 것과 실제 처리 완료는 달라요.<br>AI 판단은 원문과 함께 확인해 주세요.</footer>
</body>
</html>
